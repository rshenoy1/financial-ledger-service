# ===================================================================
# 🚀 THREAD MODEL OPTIMIZATION (PROJECT LOOM)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# 📊 CONCURRENCY TUNED HIKARICP CONNECTION POOL
# ===================================================================
spring.datasource.url=jdbc:postgresql://postgres-db:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=SecureVaultPass2026!
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# 🛡️ DATA ACCESS LAYER HARDENING & MIGRATION CONTROLS
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migration Automation Controls - Using Native Classpath Execution
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# ===================================================================
# ENTERPRISE DISTRIBUTED TELEMETRY & MONITORING METRICS
# ===================================================================
# Expose the prometheus and health endpoints over the network gateway
management.endpoints.web.exposure.include=health,prometheus

# Enable detailed metrics collection for JVM memory, virtual threads, and HikariCP
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=financial-ledger-service
management.metrics.export.prometheus.enabled=true