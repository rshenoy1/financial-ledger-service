# ===================================================================
# 🚀 THREAD MODEL OPTIMIZATION (PROJECT LOOM)
# ===================================================================
# Configures the Spring embedded container to handle all incoming HTTP 
# traffic and task routing natively utilizing lightweight Virtual Threads.
spring.threads.virtual.enabled=true

# ===================================================================
# 📊 CONCURRENCY TUNED HIKARICP CONNECTION POOL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=SecureVaultPass2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Throttle Barrier: Prevents Virtual Thread velocity from 
# overwhelming PostgreSQL connection constraints, avoiding CPU thrashing.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# 🛡️ DATA ACCESS LAYER HARDENING (JPA & HIBERNATE)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable query logging in production properties to prevent raw transactional 
# amounts, balances, and PII from spilling into disk logs under heavy traffic.
spring.jpa.show-sql=false
