# ===================================================================
# NATIVE CORE WEB APPLICATION PARAMETERS
# ===================================================================
server.port=8080
spring.application.name=financial-ledger-service

# 🚀 PROJECT LOOM ACTIVATION: Forces the application to process connections on non-blocking user-space threads
spring.threads.virtual.enabled=true

# ===================================================================
# DATABASE PERSISTENCE PROPERTIES (POSTGRES INTERFACES)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===================================================================
# DATABASE MIGRATION ENGINE PLUGINS (FLYWAY CORE)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# ENDPOINT MANAGEMENT INTERFACES (OPEN TELEMETRY AND ACTUATOR ACTI)
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=financial-ledger-service