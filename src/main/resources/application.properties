# ===================================================================
# ENTERPRISE PLATFORM RUNTIME DATA MATRIX CONFIGURATIONS
# ===================================================================
spring.application.name=financial-ledger-service

# Database connectivity properties routing through the internal Docker network layer
spring.datasource.url=jdbc:postgresql://postgres-db:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_password
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP high-concurrency thread connection scaling configurations
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Object-Relational abstraction mapping configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway version-controlled schema evolution configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# Project Loom High-Volume Concurrency Virtual Thread Activator
spring.threads.virtual.enabled=true

# ===================================================================
# ENTERPRISE DISTRIBUTED TELEMETRY & MONITORING METRICS
# ===================================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=financial-ledger-service
management.metrics.export.prometheus.enabled=true