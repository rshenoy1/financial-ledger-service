version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: SecureVaultPass2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "shared_buffers=512MB",
      "-c", "effective_cache_size=1536MB",
      "-c", "work_mem=16MB",
      "-c", "maintenance_work_mem=128MB"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger-service:
    image: financial-ledger-service:1.0.0
    container_name: ledger-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/ledger_db
      - SPRING_DATASOURCE_USERNAME=ledger_user
      - SPRING_DATASOURCE_PASSWORD=SecureVaultPass2026!
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local