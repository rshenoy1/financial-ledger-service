services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_ledger_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - ledger-network

  ledger-app:
    image: financial-ledger-service:1.0.0
    container_name: ledger-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ledger_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ledger-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ledger-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - ledger-app
    networks:
      - ledger-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ledger-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # 🚀 Production Binding: Freeze datasources and dashboards directly into Grafana's core memory space
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - ledger-network

volumes:
  postgres_ledger_data:

networks:
  ledger-network:
    driver: bridge